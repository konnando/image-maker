<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像合成</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f4f6f8;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
    justify-content:center;
}

button{
    padding:10px 14px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:#fff;
    cursor:pointer;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

#operationList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.operation{
    background:#fff;
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid #dcdcdc;
}

.order{
    min-width:32px;
    text-align:center;
    font-weight:bold;
}

.preview{
    width:120px;
    height:120px;
    border:1px solid #ccc;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    overflow:hidden;
}

.preview img{
    max-width:100%;
    max-height:100%;
}

.file-label{
    flex:1;
}

.output{
    margin-top:20px;
    text-align:center;
}

#outputImage{
    max-width:100%;
    border:1px solid #ccc;
    background:
      linear-gradient(45deg,#eee 25%,transparent 25%),
      linear-gradient(-45deg,#eee 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eee 75%),
      linear-gradient(-45deg,transparent 75%,#eee 75%);
    background-size:20px 20px;
}

@media(max-width:600px){

.operation{
    flex-wrap:wrap;
}

.preview{
    width:100%;
    height:180px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>画像合成</h1>

<div class="toolbar">
    <button id="addBtn">追加</button>
    <button id="defaultBtn">デフォルト追加</button>
    <button id="exportBtn">PNG出力</button>
    <button id="shareBtn">X共有</button>
</div>

<div id="operationList"></div>

<div class="output">
    <h2>出力結果</h2>
    <img id="outputImage">
</div>

</div>

<canvas id="mergeCanvas" style="display:none"></canvas>

<script>

const MAX_ITEMS = 5;
let dragTarget = null;
let lastOutput = null;

const operationList =
document.getElementById("operationList");

function updateOrder(){

    [...operationList.children]
    .forEach((row,index)=>{

        row.querySelector(".order")
           .textContent = index + 1;
    });

    const count =
      operationList.children.length;

    document.getElementById("addBtn")
      .disabled = count >= MAX_ITEMS;

    document.getElementById("defaultBtn")
      .disabled = count >= MAX_ITEMS;

    document
      .querySelectorAll(".deleteBtn")
      .forEach(btn=>{

          btn.disabled = count <= 1;
      });
}

function createDefaultImage(){

    const c = document.createElement("canvas");
    c.width = 500;
    c.height = 500;

    const ctx = c.getContext("2d");

    ctx.clearRect(0,0,500,500);

    ctx.fillStyle="#ff9800";
    ctx.beginPath();
    ctx.arc(250,250,170,0,Math.PI*2);
    ctx.fill();

    return c.toDataURL("image/png");
}

function addOperation(defaultImage=null){

    const row=document.createElement("div");
    row.className="operation";
    row.draggable=true;

    row.innerHTML=`
      <div class="order"></div>

      <div class="preview">
        <img>
      </div>

      <input type="file"
             accept=".jpg,.jpeg,.png">

      <button class="deleteBtn">
        削除
      </button>
    `;

    const img=row.querySelector("img");
    const file=row.querySelector("input");

    row.imageData=null;

    if(defaultImage){
        img.src=defaultImage;
        row.imageData=defaultImage;
    }

    file.addEventListener("change",e=>{

        const f=e.target.files[0];
        if(!f)return;

        const reader=new FileReader();

        reader.onload=ev=>{

            img.src=ev.target.result;
            row.imageData=ev.target.result;
        };

        reader.readAsDataURL(f);
    });

    row.querySelector(".deleteBtn")
       .addEventListener("click",()=>{

        row.remove();
        updateOrder();
    });

    row.addEventListener("dragstart",()=>{
        dragTarget=row;
    });

    row.addEventListener("dragover",(e)=>{
        e.preventDefault();
    });

    row.addEventListener("drop",(e)=>{

        e.preventDefault();

        if(row===dragTarget)return;

        const rect=row.getBoundingClientRect();

        if(e.clientY >
           rect.top + rect.height/2){

            row.after(dragTarget);
        }else{

            row.before(dragTarget);
        }

        updateOrder();
    });

    operationList.appendChild(row);
    updateOrder();
}

async function buildImage(){

    const list =
        [...operationList.children]
        .filter(x=>x.imageData);

    if(!list.length){

        alert("画像を選択してください");
        return null;
    }

    const images=[];

    for(const item of list){

        const img=new Image();

        await new Promise(resolve=>{

            img.onload=resolve;
            img.src=item.imageData;
        });

        images.push(img);
    }

    const maxWidth =
      Math.max(...images.map(x=>x.width));

    const maxHeight =
      Math.max(...images.map(x=>x.height));

    const canvas=
      document.getElementById("mergeCanvas");

    canvas.width=maxWidth;
    canvas.height=maxHeight;

    const ctx=canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    images.forEach(img=>{

        const x=
         (canvas.width-img.width)/2;

        const y=
         (canvas.height-img.height)/2;

        ctx.drawImage(img,x,y);
    });

    return canvas.toDataURL("image/png");
}
