<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像合成</title>

<style>
body{
  font-family:sans-serif;
  margin:20px;
}

button{
  padding:10px;
  margin:5px;
}

.row{
  border:1px solid #ccc;
  padding:10px;
  margin:5px 0;
}
</style>
</head>
<body>

<h1>画像合成</h1>

<button id="addBtn">追加</button>

<div id="list"></div>

<script>

const addBtn =
  document.getElementById("addBtn");

const list =
  document.getElementById("list");

let count = 0;

addBtn.onclick = function(){

  count++;

  const div =
    document.createElement("div");

  div.className = "row";

  div.textContent =
    "操作セット " + count;

  list.appendChild(div);
};

</script>

</body>
</html>
